name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # FOODPULSE_RUN_DB_TESTS is intentionally unset: there's no Postgres
        # service container here, so the tests that need a live database
        # (see tests/conftest.py's requires_db marker) skip automatically.
        run: pytest tests/ -v
